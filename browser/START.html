<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>つみなまこ v0.4.10 — ツミナマコ研究手帖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap"><main id="stage" aria-label="つみなまこ">
<div id="lcd-hardware" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div><canvas id="canvas" width="540" height="860" aria-label="ナマコを残して水槽を目標まで埋める落ち物ゲーム"></canvas>
<h1>つみなまこ</h1><button id="settings-open" class="small">設定</button><button id="difficulty" class="small" aria-label="難易度を変更。現在ふつう">ふつう</button><button id="track" class="small" title="BGMの曲を切替">♪ 潮の庭</button>
<button id="theme" class="small" aria-label="ダークモード切替" aria-pressed="false">夜モード</button>
<button id="music" class="small" title="BGMのオン／オフ">BGM ON</button>
<button id="sfx" class="small" title="効果音のオン／オフ">SE ON</button>
<div id="version">DEEP SEA STACK</div><button id="speed" class="small" title="落下スピードを変更">速さ ×1.0</button><button id="menu" class="small" hidden>Ⅱ ポーズ</button>
<div id="tip"></div><button id="lore-button" class="small" aria-label="博士のうんちくを読む">うんちく</button><button id="cards-button" class="small" hidden>図鑑 0/20</button><div id="mode">AUTO DEMO</div><div id="count"></div>
<div id="fill-label">FILL</div><div id="fill">0%</div><div id="target">/ 90%</div><div id="next-label">NEXT</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="celebrate-banner" hidden><div id="celebrate-title">やったね！ 仲間が増えたよ！</div><div id="celebrate-message"></div></div>
<button id="resume-save" class="primary" hidden>つづきから</button>
<button id="start" class="primary" title="空の水槽から遊びます（Enter / Space）">スタート</button>
<div id="controls" hidden>
<button id="left" aria-label="左に移動" title="左に移動（← / A）">←</button>
<button id="right" aria-label="右に移動" title="右に移動（→ / D）">→</button>
<button id="rotate" title="回転（Z / X / ↑）">回す</button>
<button id="drop" class="primary" title="一気に落とす（Space）">落とす ↓</button>
</div>
<div id="footer"></div>
<div id="settings-layer" hidden><section id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><h2 id="settings-title">設定</h2><input id="music-volume" type="range" min="0" max="100" step="5" value="70" aria-label="BGM音量"><button id="motion-toggle">演出を軽く: OFF</button><button id="settings-close" class="primary">閉じる</button></section></div>
<div id="shade" hidden></div>
<section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
<h2 id="modal-title"></h2><div id="modal-note"></div>
<button id="continue" class="primary">つづける</button>
<button id="restart-pause" class="primary">はじめから</button>
<button id="to-demo">デモに戻る</button>
</section>
<section id="reward" role="dialog" aria-modal="true" aria-labelledby="reward-title" hidden>
<h2 id="reward-title">カードをゲット！</h2>
<div id="reward-aura" aria-hidden="true"></div>
<div id="reward-sparks" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
<div id="reward-flip"><div id="reward-back" class="reward-face" aria-hidden="true">✦<span>NAMAKO</span>✦</div><img id="reward-front" class="reward-face" alt=""></div>
<div id="reward-note" role="status" aria-live="polite"></div>
<button id="reward-next" class="primary">次の水槽へ ▶</button>
</section>
<section id="trivia" role="dialog" aria-modal="true" aria-labelledby="trivia-title" hidden>
<div id="trivia-heading" class="trivia-heading">✦ １面クリア ✦</div>
<div class="trivia-lab"><button id="trivia-professor-open" class="trivia-professor-open" type="button" aria-label="博士のカードを見る"><img id="trivia-professor" src="../assets/professor_gabo.webp" alt="白髪と丸眼鏡、白衣の博士"></button><div class="trivia-speech">わしは<br>『つみなまこ』研究の<br>博士である。</div><div class="trivia-companions"><button id="trivia-dog-open" class="trivia-companion" type="button" aria-label="犬のコリ助のカードを見る"><img id="trivia-dog-card" src="assets/trivia_korisuke.webp" data-en-src="assets/trivia_korisuke_en.webp" alt="助手の犬コリ助のカード"><span>コリ助</span></button><button id="trivia-dolphin-open" class="trivia-companion" type="button" aria-label="イルカのプレ号のカードを見る"><img id="trivia-dolphin-card" src="assets/trivia_corinpre.webp" data-en-src="assets/trivia_corinpre_en.webp" alt="イルカのプレ号のカード"><span>プレ号</span></button></div><img id="trivia-professor-card" src="assets/trivia_professor.webp" data-en-src="assets/trivia_professor_en.webp" alt="" hidden></div>
<div class="trivia-name">ガボジョイック・ベヘソナー博士</div>
<article id="trivia-paper" class="trivia-paper"><div id="trivia-number">研究手帖 001 / 200</div><h2 id="trivia-title"></h2><p id="trivia-body"></p></article>
<div class="trivia-footnote" aria-live="polite">ツミナマコは架空の生き物です。</div>
<button id="trivia-more" hidden>もう１話</button><button id="trivia-next" class="primary">次の面へ ▶</button>
<div id="trivia-card-viewer" role="dialog" aria-modal="true" aria-label="博士と仲間のカード" hidden><button id="trivia-card-close" type="button">閉じる ×</button><img id="trivia-card-large" alt=""><div id="trivia-card-caption"></div></div>
</section>
<section id="collection" role="dialog" aria-modal="true" aria-labelledby="collection-title" hidden>
<h2 id="collection-title">ナマコ図鑑</h2><button id="collection-close" class="small">閉じる</button>
<div id="collection-progress"></div><div id="collection-grid"></div>
</section>
</main></div>
<noscript>このお試し版ではJavaScriptを有効にしてください。通信・ログインは不要です。</noscript>
<script src="card_catalog.js"></script><script src="trivia_catalog.js"></script><script src="locale_catalog.js"></script><script src="i18n.js"></script><script src="trivia.js"></script><script src="cards.js"></script><script src="rules.js"></script><script src="rewards.js"></script><script src="session.js"></script><script src="game.js"></script>
</body>
</html>
